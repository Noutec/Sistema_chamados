<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abrir chamado | Central de chamados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">
  <header class="cabecalho text-white">
    <div class="container d-flex flex-wrap align-items-center justify-content-between column-gap-3 py-2">
      <a class="text-white text-decoration-none fw-semibold py-2" href="index.html">Central de chamados</a>
      <nav class="nav nav-pills" aria-label="Navegação principal">
        <a class="nav-link text-white" href="index.html">Todos</a>
        <a class="nav-link text-white" href="active.html">Ativos</a>
        <a class="nav-link active" aria-current="page" href="open.html">Novo chamado</a>
      </nav>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="card border-0 shadow-sm">
          <div class="card-body conteudo-formulario p-sm-4">
            <h1 class="h2 mb-2">Abrir chamado</h1>
            <p class="small text-secondary">Todos os campos são obrigatórios.</p>
            <form id="form-abrir-chamado">
              <div class="mb-3">
                <label for="nome-novo" class="form-label">Nome</label>
                <input id="nome-novo" name="nome" class="form-control" maxlength="80" required>
              </div>
              <div class="mb-3">
                <label for="setor-novo" class="form-label">Setor</label>
                <select id="setor-novo" name="setor" class="form-select" required>
                  <option value="">Selecione o setor</option>
                  <option>Financeiro</option>
                  <option>Jurídico</option>
                  <option>Comercial</option>
                  <option>Recursos Humanos</option>
                  <option>Logística</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="equipamento-novo" class="form-label">Tipo de equipamento</label>
                <input id="equipamento-novo" name="equipamento" class="form-control" maxlength="80" placeholder="Digite o tipo de equipamento" required>
              </div>
              <div class="mb-4">
                <label for="problema-novo" class="form-label">Descrição do problema</label>
                <textarea id="problema-novo" name="problema" class="form-control" rows="4" maxlength="600" required></textarea>
              </div>
              <div class="acoes-formulario">
                <button class="btn btn-primary" type="submit">Enviar chamado</button>
                <a class="btn btn-outline-secondary" href="index.html">Voltar para todos</a>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="container pb-4 small text-secondary">Renan / João</footer>
  <script src="js/open.js"></script>
</body>
</html>
