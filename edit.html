<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar chamado | Central de chamados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">
  <header class="cabecalho text-white">
    <div class="container d-flex flex-wrap align-items-center justify-content-between column-gap-3 py-2">
      <a class="text-white text-decoration-none fw-semibold py-2" href="index.html">Central de chamados</a>
      <nav class="nav nav-pills" aria-label="Navegação principal">
        <a class="nav-link text-white" href="index.html">Todos</a>
        <a class="nav-link text-white" href="active.html">Aguardando atendimento</a>
        <a class="nav-link text-white" href="open.html">Novo chamado</a>
        <a class="nav-link text-white" href="registrations.html">Cadastros</a>
      </nav>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="h2 mb-2">Editar chamado</h1>
        <details id="painel-edicao" open hidden class="card border-0 shadow-sm p-3 mb-3">
          <summary id="titulo-edicao" class="fw-semibold"></summary>
          <div class="pt-3">
            <p>Status atual: <span id="status-atual" class="badge"></span></p>
            <form id="form-editar-chamado">
              <div class="mb-3">
                <label for="edit-nome" class="form-label">Nome</label>
                <input id="edit-nome" name="nome" class="form-control" maxlength="80" pattern=".*\S.*" aria-describedby="ajuda-edit-nome" required>
                <div id="ajuda-edit-nome" class="form-text">Informe pelo menos um caractere que não seja espaço.</div>
              </div>
              <div class="mb-3">
                <label for="edit-setor" class="form-label">Setor</label>
                <select id="edit-setor" name="setor" class="form-select" required>
                  <option value="">Selecione o setor</option>
                  <option>Financeiro</option>
                  <option>Jurídico</option>
                  <option>Comercial</option>
                  <option>Recursos Humanos</option>
                  <option>Logística</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="edit-prioridade" class="form-label">Prioridade</label>
                <select id="edit-prioridade" name="prioridade" class="form-select" required>
                  <option value="">Selecione a prioridade</option>
                  <option value="baixa">Baixa</option>
                  <option value="media">Média</option>
                  <option value="alta">Alta</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="edit-categoria" class="form-label">Categoria</label>
                <select id="edit-categoria" name="categoria" class="form-select" required>
                  <option value="">Selecione a categoria</option>
                  <option value="hardware">Hardware</option>
                  <option value="software">Software</option>
                  <option value="rede">Rede</option>
                  <option value="outros">Outros</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="edit-equipamento" class="form-label">Equipamento</label>
                <select id="edit-equipamento" name="equipamento" class="form-select" required>
                  <option value="">Selecione o equipamento</option>
                </select>
                <div class="form-text">Gerencie a lista em <a href="cadastro.html">Cadastros</a>.</div>
              </div>
              <div class="mb-4">
                <label for="edit-problema" class="form-label">Descrição do problema</label>
                <textarea id="edit-problema" name="problema" class="form-control" rows="4" maxlength="600" required></textarea>
              </div>
              <div class="mb-3">
                <label for="edit-tecnico" class="form-label">Técnico responsável</label>
                <select id="edit-tecnico" name="tecnico" class="form-select">
                  <option value="">Sem técnico definido</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="edit-status" class="form-label">Status</label>
                <select id="edit-status" name="status" class="form-select" required>
                  <option value="Ativo">Aguardando atendimento</option>
                  <option value="Em andamento">Em andamento</option>
                  <option value="Resolvido">Resolvido</option>
                </select>
              </div>
              <div class="mb-4">
                <label for="edit-solucao" class="form-label">Solução</label>
                <textarea id="edit-solucao" name="solucao" class="form-control" rows="3" maxlength="600"></textarea>
              </div>
              <div class="acoes-formulario">
                <button class="btn btn-primary" type="submit">Salvar alterações</button>
                <a class="btn btn-outline-secondary" id="voltar-detalhes">Voltar para os detalhes</a>
                <button id="botao-excluir" class="btn btn-outline-danger" type="button">Excluir chamado</button>
              </div>
            </form>
          </div>
        </details>
        <p id="edicao-mensagem" role="status" hidden></p>
        <a id="edicao-voltar" href="index.html#lista" hidden>← Ver todos os chamados</a>
      </div>
    </div>
  </main>

  <footer class="container pb-4 small text-secondary">Renan / João</footer>
  <script src="js/chamados.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
