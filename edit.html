<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar chamado | Central de chamados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">
  <header class="cabecalho text-white">
    <div class="container d-flex flex-wrap align-items-center justify-content-between column-gap-3 py-2">
      <a class="text-white text-decoration-none fw-semibold py-2" href="index.html">Central de chamados</a>
      <nav class="nav nav-pills" aria-label="Navegação principal">
        <a class="nav-link text-white" href="index.html">Todos</a>
        <a class="nav-link text-white" href="active.html">Ativos</a>
        <a class="nav-link text-white" href="open.html">Novo chamado</a>
      </nav>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="card border-0 shadow-sm">
          <div class="card-body p-sm-4">
            <h1 id="titulo-edicao" class="h2 mb-3">Editar chamado</h1>

            <form id="form-editar-chamado">
              <div class="mb-3">
                <label for="edit-nome" class="form-label">Nome</label>
                <input id="edit-nome" name="nome" class="form-control" maxlength="80" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="edit-setor" class="form-label">Setor</label>
                  <select id="edit-setor" name="setor" class="form-select" required>
                    <option value="">Selecione o setor</option>
                    <option>Financeiro</option>
                    <option>Jurídico</option>
                    <option>Comercial</option>
                    <option>Recursos Humanos</option>
                    <option>Logística</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="edit-equipamento" class="form-label">Equipamento</label>
                  <select id="edit-equipamento" name="equipamento" class="form-select" required></select>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="edit-status" class="form-label">Status</label>
                  <select id="edit-status" name="status" class="form-select" required>
                    <option value="Ativo">Ativo</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Resolvido">Resolvido</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="edit-tecnico" class="form-label">Técnico responsável</label>
                  <select id="edit-tecnico" name="tecnico" class="form-select"></select>
                </div>
              </div>

              <div class="mb-3">
                <label for="edit-problema" class="form-label">Descrição do problema</label>
                <textarea id="edit-problema" name="problema" class="form-control" rows="3" maxlength="600" required></textarea>
              </div>

              <div class="mb-4">
                <label for="edit-solucao" class="form-label">Solução aplicada (obrigatório para resolver)</label>
                <textarea id="edit-solucao" name="solucao" class="form-control" rows="3" maxlength="600" placeholder="Descreva o que foi feito para resolver o chamado."></textarea>
              </div>

              <div class="d-flex flex-wrap justify-content-between gap-2">
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Salvar alterações</button>
                  <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
                </div>
                <button id="botao-excluir" class="btn btn-outline-danger" type="button">Excluir chamado</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="container pb-4 small text-secondary">Renan / João</footer>
  <script src="js/edit.js"></script>
</body>
</html>
