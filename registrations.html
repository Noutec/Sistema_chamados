<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastros | Central de chamados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">
  <header class="cabecalho text-white">
    <div class="container d-flex flex-wrap align-items-center justify-content-between column-gap-3 py-2">
      <a class="text-white text-decoration-none fw-semibold py-2" href="index.html">Central de chamados</a>
      <nav class="nav nav-pills" aria-label="Navegação principal">
        <a class="nav-link text-white" href="index.html">Todos</a>
        <a class="nav-link text-white" href="active.html">Aguardando atendimento</a>
        <a class="nav-link text-white" href="open.html">Novo chamado</a>
        <a class="nav-link active" aria-current="page" href="registrations.html">Cadastros</a>
      </nav>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <h1 class="h2 mb-3">Cadastros</h1>
    <div class="row g-3">
      <section class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 mb-3">Técnicos</h2>
            <form id="form-tecnico" class="mb-3">
              <label for="nome-tecnico" class="form-label">Nome do técnico</label>
              <div class="d-flex gap-2">
                <input id="nome-tecnico" class="form-control" maxlength="80" required>
                <button class="btn btn-primary" type="submit">Adicionar</button>
              </div>
            </form>
            <ul id="lista-tecnicos" class="list-group"></ul>
          </div>
        </div>
      </section>
      <section class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 mb-3">Equipamentos</h2>
            <form id="form-equipamento" class="mb-3">
              <label for="nome-equipamento" class="form-label">Nome do equipamento</label>
              <div class="d-flex gap-2">
                <input id="nome-equipamento" class="form-control" maxlength="100" required>
                <button class="btn btn-primary" type="submit">Adicionar</button>
              </div>
            </form>
            <ul id="lista-equipamentos" class="list-group"></ul>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="container pb-4 small text-secondary">Renan / João</footer>
  <script src="js/chamados.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
