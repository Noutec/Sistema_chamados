<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos os chamados | Central de chamados</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">
  <header class="cabecalho text-white">
    <div class="container d-flex flex-wrap align-items-center justify-content-between column-gap-3 py-2">
      <a class="text-white text-decoration-none fw-semibold py-2" href="index.html">Central de chamados</a>
      <nav class="nav nav-pills" aria-label="Navegação principal">
        <a class="nav-link active" aria-current="page" href="index.html">Todos</a>
        <a class="nav-link text-white" href="active.html">Ativos</a>
        <a class="nav-link text-white" href="open.html">Novo chamado</a>
      </nav>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h1 class="h2 mb-1">Todos os chamados</h1>
      </div>
      <div class="d-flex gap-2">
        <button id="btn-tema" class="btn btn-outline-secondary" type="button">Modo Escuro</button>
        <a class="btn btn-primary" href="open.html">+ Abrir chamado</a>
      </div>
    </div>

    <section class="row g-3 mb-4" aria-label="Indicadores">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm p-3">
          <span class="small text-secondary">Total</span>
          <strong id="ind-total" class="fs-3">0</strong>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm p-3 border-start border-danger border-4">
          <span class="small text-secondary">Ativos</span>
          <strong id="ind-ativos" class="fs-3 text-danger">0</strong>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm p-3 border-start border-warning border-4">
          <span class="small text-secondary">Em andamento</span>
          <strong id="ind-andamento" class="fs-3 text-warning">0</strong>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
          <span class="small text-secondary">Resolvidos</span>
          <strong id="ind-resolvidos" class="fs-3 text-success">0</strong>
        </div>
      </div>
    </section>

    <nav aria-label="Filtrar chamados por status">
      <ul class="list-unstyled d-flex flex-wrap gap-2 mb-3">
        <li><a class="btn btn-sm btn-secondary" href="index.html" aria-current="page">Todos</a></li>
        <li><a class="btn btn-sm btn-outline-danger" href="active.html">Ativos</a></li>
        <li><a class="btn btn-sm btn-outline-dark" href="in-progress.html">Em andamento</a></li>
        <li><a class="btn btn-sm btn-outline-success" href="resolved.html">Resolvidos</a></li>
      </ul>
    </nav>

    <section class="card border-0 shadow-sm p-3 mb-3">
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" id="campo-busca" class="form-control" placeholder="Buscar por nome, nº ou problema...">
        </div>
        <div class="col-md-3">
          <select id="filtro-status" class="form-select">
            <option value="">Todos os status</option>
            <option value="Ativo">Ativo</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Resolvido">Resolvido</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="filtro-setor" class="form-select">
            <option value="">Todos os setores</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Jurídico">Jurídico</option>
            <option value="Comercial">Comercial</option>
            <option value="Recursos Humanos">Recursos Humanos</option>
            <option value="Logística">Logística</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="ordem-lista" class="form-select">
            <option value="desc">Mais recentes</option>
            <option value="asc">Mais antigos</option>
          </select>
        </div>
      </div>
    </section>

    <div id="lista" class="card border-0 shadow-sm">
      <div class="table-responsive" tabindex="0" role="region" aria-label="Lista de chamados">
        <table class="table table-hover align-middle mb-0 tabela-chamados">
          <thead class="table-light">
            <tr>
              <th scope="col">Nº</th>
              <th scope="col">Nome</th>
              <th scope="col">Setor</th>
              <th scope="col">Equipamento</th>
              <th scope="col">Prioridade</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-chamados"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="container pb-4 small text-secondary">Renan / João</footer>
  <script src="js/index.js"></script>
</body>
</html>
